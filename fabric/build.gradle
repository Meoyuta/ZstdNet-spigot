def clientMixinEnabled = (findProperty("client_mixin_enabled") ?: "true").toString().toBoolean()
def clientLoomEnabled = (findProperty("client_loom_enabled") ?: clientMixinEnabled.toString()).toString().toBoolean()
def namedClientJarEnabled = (findProperty("named_client_jar_enabled") ?: "false").toString().toBoolean()
def minecraftClientUrl = (findProperty("minecraft_client_url") ?: "").toString()
def namedClientJar = layout.buildDirectory.file("minecraft-client/${minecraft_version}.jar")

if (clientLoomEnabled) {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }
}

if (namedClientJarEnabled) {
    tasks.register("downloadMinecraftClientJar") {
        outputs.file(namedClientJar)
        doLast {
            if (minecraftClientUrl.isBlank()) {
                throw new GradleException("minecraft_client_url is required when named_client_jar_enabled=true")
            }
            def out = namedClientJar.get().asFile
            out.parentFile.mkdirs()
            ant.get(src: minecraftClientUrl, dest: out, skipexisting: true)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        dependsOn tasks.named("downloadMinecraftClientJar")
    }
}

dependencies {
    if (clientLoomEnabled) {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()

        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        modImplementation "dev.architectury:architectury-fabric:${architectury_api_version}"
    } else {
        compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
        compileOnly "dev.architectury:architectury-fabric:${architectury_api_version}"
        compileOnly "org.slf4j:slf4j-api:2.0.16"
        compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
        compileOnly "io.netty:netty-all:4.1.118.Final"
        if (namedClientJarEnabled) {
            compileOnly files(namedClientJar)
        }
    }

    implementation project(":core")
    implementation project(":mod-common")
    implementation "com.github.luben:zstd-jni:${zstd_jni_version}"

    if (clientLoomEnabled) {
        include project(":core")
        include project(":mod-common")
        include "com.github.luben:zstd-jni:${zstd_jni_version}"
    }
}

if (!clientMixinEnabled) {
    sourceSets.main.java {
        exclude "**/mixin/**"
        exclude "**/ZstdNetConnectHooks.java"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "fabric_loader_version", fabric_loader_version
    inputs.property "architectury_api_version", architectury_api_version
    inputs.property "java_version", java_version
    inputs.property "client_mixin_enabled", clientMixinEnabled
    filesMatching("fabric.mod.json") {
        expand(
            version: project.version,
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
            architectury_api_version: architectury_api_version,
            java_version: java_version,
            mod_id: mod_id,
            mod_name: mod_name
        )
    }
    filesMatching("zstdnet26.mixins.json") {
        expand(java_version: java_version)
        if (!clientMixinEnabled) {
            filter { line -> line.contains("Mixin\"") ? "" : line }
        }
    }
}

if (!clientLoomEnabled) {
    jar {
        dependsOn configurations.runtimeClasspath
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    }
}
