name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Remember JDK 21
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "JAVA_HOME_21_X64=$env:JAVA_HOME"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Remember JDK 25
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "JAVA_HOME_25_X64=$env:JAVA_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all variants
        shell: cmd
        run: build.bat

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: zstdnet-jars
          path: target/*.jar
          if-no-files-found: error
